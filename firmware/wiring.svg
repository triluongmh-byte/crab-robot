<svg xmlns="http://www.w3.org/2000/svg" width="980" height="800" viewBox="0 0 980 800" role="img" aria-label="Sơ đồ đấu dây Robot Cua, nối đúng nhãn từng chân">
<rect width="980" height="800" fill="#f7f8fa"/>
<g font-family="Arial,sans-serif" font-size="19" fill="#162f40"><text x="32" y="35" font-size="24" font-weight="bold">ROBOT CUA — NỐI THEO NHÃN, RÚT CẢ HAI USB KHI CẮM DÂY</text>
<rect x="30" y="70" width="265" height="120" rx="12" fill="#fff" stroke="#405d70" stroke-width="2"/><text x="45" y="101">Pin dự phòng USB 5 V</text><text x="45" y="133">Cổng 1 → USB-C</text><text x="45" y="166">Cổng 2 → cáp đỏ / đen</text>
<rect x="30" y="245" width="300" height="280" rx="12" fill="#def0fd" stroke="#405d70" stroke-width="2"/><text x="45" y="275" font-weight="bold">LILYGO T-Display-S3</text><text x="45" y="300">Non-touch · màn hình lên</text><text x="160" y="343">18 → SDA</text><text x="160" y="382">17 → SCL</text><text x="160" y="421">3V → VCC</text><text x="160" y="460">GND chung</text><text x="160" y="500">21 → DIN</text>
<rect x="525" y="245" width="425" height="280" rx="12" fill="#e4f5e8" stroke="#405d70" stroke-width="2"/><text x="543" y="275" font-weight="bold">PCA9685 · 0x40</text><text x="543" y="300">Terminal V+ / GND: cáp cổng 2</text><text x="543" y="343">SDA</text><text x="543" y="382">SCL</text><text x="543" y="421">VCC = 3,3 V</text><text x="543" y="460">GND</text><text x="720" y="421">OE: để trống</text><text x="543" y="500">CH0–CH7 → 8 SG90</text>
<rect x="525" y="620" width="425" height="140" rx="12" fill="#fff0cb" stroke="#405d70" stroke-width="2"/><text x="543" y="649" font-weight="bold">KK10 — 8 WS2812, đầu IN</text><text x="543" y="681">DIN ← 21 (tín hiệu 3,3 V)</text><text x="543" y="713">5V ← PCA V+ (5 V cổng 2)</text><text x="543" y="745">GND ← PCA GND</text>
<text x="35" y="578">SG90: nâu/đen = GND</text><text x="35" y="608">đỏ = V+ · cam/vàng = PWM</text><text x="35" y="654">Hông / gối: FL CH0/1, FR CH2/3</text><text x="35" y="684">RL CH4/5, RR CH6/7</text><text x="35" y="738" font-weight="bold">VCC khác V+!</text><text x="35" y="770">BOARD GIẢ: không lắp vào robot.</text></g>
<g fill="none" stroke-width="4"><path d="M80 190V245" stroke="#6b7480"/><path d="M295 150H750V245" stroke="#bd252b"/><path d="M330 338H525" stroke="#148346"/><path d="M330 377H525" stroke="#aa7e06"/><path d="M330 416H525" stroke="#c05b10"/><path d="M330 455H525" stroke="#17212b"/><path d="M330 495H420V676H525" stroke="#136db1"/><path d="M790 525V620" stroke="#bd252b"/><path d="M830 525V620" stroke="#17212b"/></g>
<g font-family="Arial,sans-serif" font-size="16" fill="#162f40"><text x="355" y="326">Xanh lá</text><text x="355" y="365">Vàng</text><text x="355" y="404">Cam</text><text x="355" y="443">Đen</text><text x="665" y="565">V+ / GND, đầu header còn lại</text><text x="345" y="590" transform="rotate(-90 345 590)">Xanh dương</text></g></svg>
