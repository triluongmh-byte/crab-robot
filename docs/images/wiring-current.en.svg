t power bank</text><text x="35" y="485">Port 1 → LILYGO USB-C</text><text x="35" y="515">Port 2 → terminal adapter</text><path d="M295 510H315V615H572V395" stroke="#db3d35" class="wire"/><path d="M295 530H307V630H594V395" stroke="#20252b" class="wire"/><text x="335" y="603">Adapter + → V+ (2 red wires)</text><text x="335" y="648">Adapter − → GND (2 black wires)</text><text x="410" y="420">CH0–7: orange PWM / red V+ / brown GND</text><text x="25" y="575">Unplug both supplies before wiring.</text></svg>
